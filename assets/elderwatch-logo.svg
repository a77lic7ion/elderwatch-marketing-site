<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="circle">
      <circle cx="100" cy="100" r="96"/>
    </clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A221E"/>
      <stop offset="35%" stop-color="#2D1B0E"/>
      <stop offset="60%" stop-color="#D46A00"/>
      <stop offset="80%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#D46A00"/>
    </radialGradient>
  </defs>

  <!-- Outer circle -->
  <circle cx="100" cy="100" r="96" fill="#1A221E" stroke="#FF8C00" stroke-width="3"/>

  <!-- Sky/sunburst background -->
  <circle cx="100" cy="100" r="94" clip-path="url(#circle)" fill="url(#sky)"/>

  <!-- Sun rays -->
  <g opacity="0.55" clip-path="url(#circle)">
    <polygon points="100,55 25,155 35,140" fill="#FFB347"/>
    <polygon points="100,55 55,160 65,145" fill="#FFB347"/>
    <polygon points="100,55 80,165 90,150" fill="#FFB347"/>
    <polygon points="100,55 115,165 125,150" fill="#FFB347"/>
    <polygon points="100,55 140,160 150,145" fill="#FFB347"/>
    <polygon points="100,55 170,155 180,140" fill="#FFB347"/>
    <polygon points="100,55 20,130 30,115" fill="#FFB347"/>
    <polygon points="100,55 175,110 185,95" fill="#FFB347"/>
    <polygon points="100,55 175,70 185,55" fill="#FFB347"/>
    <polygon points="100,55 170,30 160,15" fill="#FFB347"/>
    <polygon points="100,55 140,10 130,-5" fill="#FFB347"/>
    <polygon points="100,55 100,-10 95,5" fill="#FFB347"/>
    <polygon points="100,55 60,-10 50,5" fill="#FFB347"/>
    <polygon points="100,55 25,10 35,-5" fill="#FFB347"/>
    <polygon points="100,55 15,30 5,15" fill="#FFB347"/>
    <polygon points="100,55 15,70 5,85" fill="#FFB347"/>
  </g>

  <!-- Sun disc -->
  <circle cx="100" cy="80" r="28" fill="url(#sun)" clip-path="url(#circle)"/>

  <!-- Rolling hills -->
  <ellipse cx="100" cy="175" rx="130" ry="50" fill="#2D5A27" clip-path="url(#circle)"/>
  <ellipse cx="55" cy="170" rx="90" ry="38" fill="#3D7A37" clip-path="url(#circle)"/>
  <ellipse cx="145" cy="172" rx="80" ry="32" fill="#4A8A44" clip-path="url(#circle)"/>
  <ellipse cx="100" cy="168" rx="60" ry="22" fill="#5A9A54" clip-path="url(#circle)"/>

  <!-- Tree trunk (baobab-style, wide and spreading) -->
  <rect x="88" y="105" width="24" height="65" fill="#1A221E" rx="4" clip-path="url(#circle)"/>

  <!-- Tree canopy (baobab — wide, flat-topped, sprawling) -->
  <ellipse cx="100" cy="65" rx="65" ry="35" fill="#1A221E" clip-path="url(#circle)"/>
  <ellipse cx="45" cy="90" rx="28" ry="22" fill="#1A221E" clip-path="url(#circle)"/>
  <ellipse cx="155" cy="90" rx="28" ry="22" fill="#1A221E" clip-path="url(#circle)"/>
  <ellipse cx="100" cy="40" rx="45" ry="28" fill="#1A221E" clip-path="url(#circle)"/>
  <ellipse cx="60" cy="55" rx="30" ry="20" fill="#1A221E" clip-path="url(#circle)"/>
  <ellipse cx="140" cy="55" rx="30" ry="20" fill="#1A221E" clip-path="url(#circle)"/>
  <ellipse cx="100" cy="75" rx="55" ry="25" fill="#1A221E" clip-path="url(#circle)"/>

  <!-- Checkmark circle on trunk -->
  <circle cx="100" cy="125" r="20" fill="#157A4C" stroke="#4CAF50" stroke-width="2.5" clip-path="url(#circle)"/>
  <path d="M90 125 L97 132 L112 117" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Curved text along bottom -->
  <path id="textPath" d="M 55,185 A 48,48 0 0,1 145,185" fill="none"/>
  <text fill="white" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" letter-spacing="1.5">
    <textPath href="#textPath" startOffset="50%" text-anchor="middle">ElderWatch</textPath>
  </text>
</svg>
